[project]
name = "databaseproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jjpb", email = "punongbayanjonathan@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
databaseproject = "databaseproject:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"          
module-root = ""             
